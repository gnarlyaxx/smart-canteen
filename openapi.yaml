openapi: 3.0.0
paths:
  /api/v1:
    get:
      operationId: AppController_getHello_v1
      parameters: []
      responses:
        "200":
          description: ""
      tags:
        - App
  /api/v1/stalls:
    get:
      description: Mendukung filter opsional berdasarkan status buka/tutup (is_open).
      operationId: StallsController_findAll_v1
      parameters:
        - name: is_open
          required: false
          in: query
          description: Filter stan berdasarkan status operasional (true/false)
          schema:
            example: true
            type: boolean
      responses:
        "200":
          description: Daftar stan berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stall"
        "400":
          description: Parameter query tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Mengambil daftar stan kantin
      tags:
        - Stalls
    post:
      operationId: StallsController_create_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStallDto"
      responses:
        "201":
          description: Stan kantin berhasil dibuat
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stall"
        "400":
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: Nama stan sudah digunakan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Mendaftarkan stan kantin baru
      tags:
        - Stalls
  /api/v1/stalls/{id}:
    get:
      operationId: StallsController_findOne_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
      responses:
        "200":
          description: Detail stan ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stall"
        "404":
          description: Stan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Mengambil detail stan kantin berdasarkan ID
      tags:
        - Stalls
    put:
      operationId: StallsController_update_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStallDto"
      responses:
        "200":
          description: Data stan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stall"
        "400":
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Stan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: Nama stan duplikat dengan stan lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Memperbarui data stan kantin berdasarkan ID
      tags:
        - Stalls
    delete:
      operationId: StallsController_remove_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
      responses:
        "204":
          description: Stan berhasil dihapus (204 No Content)
        "404":
          description: Stan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Menghapus stan kantin berdasarkan ID
      tags:
        - Stalls
  /api/v1/menus:
    get:
      description: Mendukung filter category, stall_id, min_price, max_price, offset
        pagination (page & limit), serta sorting dengan tie-breaker id:asc.
      operationId: MenusController_findAll_v1
      parameters:
        - name: category
          required: false
          in: query
          description: Filter berdasarkan kategori menu
          schema:
            example: makanan
            type: string
            enum:
              - makanan
              - minuman
              - snack
        - name: stall_id
          required: false
          in: query
          description: Filter berdasarkan ID stan kantin
          schema:
            example: 1
            type: number
        - name: min_price
          required: false
          in: query
          description: Filter batas harga minimum
          schema:
            example: 5000
            type: number
        - name: max_price
          required: false
          in: query
          description: Filter batas harga maksimum
          schema:
            example: 25000
            type: number
        - name: page
          required: false
          in: query
          description: Nomor halaman (Offset Pagination, dimulai dari 1)
          schema:
            default: 1
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: Jumlah item per halaman (default 10, maksimal 100)
          schema:
            default: 10
            example: 10
            type: number
        - name: sort
          required: false
          in: query
          description: "Parameter sorting dengan format field:direction (contoh:
            price:asc,id:asc). Default: created_at:desc,id:asc"
          schema:
            example: price:asc,id:asc
            type: string
      responses:
        "200":
          description: Daftar menu dengan metadata pagination berhasil diambil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedMenuResponseDto"
        "400":
          description: Parameter query tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Mengambil daftar menu kantin (Filtering, Offset Pagination &
        Tie-breaker Sorting)
      tags:
        - Menus
    post:
      operationId: MenusController_create_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMenuDto"
      responses:
        "201":
          description: Menu berhasil ditambahkan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          description: Validasi input gagal (misal harga < 1000 atau stok negatif)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Stan (stall_id) tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: Nama menu sudah terdaftar (409 Conflict)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Menambahkan menu kantin baru
      tags:
        - Menus
  /api/v1/menus/{id}:
    get:
      operationId: MenusController_findOne_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
      responses:
        "200":
          description: Detail menu berhasil ditemukan (disertai header ETag)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "404":
          description: Menu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Mengambil detail menu berdasarkan ID (menyertakan header ETag)
      tags:
        - Menus
    put:
      operationId: MenusController_updatePut_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
        - name: If-Match
          in: header
          description: 'Nilai ETag versi menu saat ini (contoh: "v1")'
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuDto"
      responses:
        "200":
          description: Menu berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Menu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: Nama menu konflik dengan menu lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "412":
          description: Header If-Match tidak cocok dengan ETag menu saat ini (412
            Precondition Failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Memperbarui seluruh data menu (mendukung Optimistic Locking via
        If-Match ETag)
      tags:
        - Menus
    patch:
      operationId: MenusController_updatePatch_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
        - name: If-Match
          in: header
          description: 'Nilai ETag versi menu saat ini (contoh: "v1")'
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMenuDto"
      responses:
        "200":
          description: Menu berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Menu"
        "400":
          description: Validasi input gagal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Menu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "409":
          description: Nama menu konflik dengan menu lain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "412":
          description: Header If-Match tidak cocok dengan ETag menu saat ini (412
            Precondition Failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Memperbarui sebagian data menu (mendukung Optimistic Locking via
        If-Match ETag)
      tags:
        - Menus
    delete:
      operationId: MenusController_remove_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
      responses:
        "204":
          description: Menu berhasil dihapus (204 No Content)
        "404":
          description: Menu tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Menghapus menu berdasarkan ID
      tags:
        - Menus
  /api/v1/orders:
    post:
      description: Memvalidasi ketersediaan setiap menu_id dan stok secara
        transaksional. Jika salah satu item tidak ditemukan (404) atau stok
        kurang (400), seluruh pemotongan stok di-rollback.
      operationId: OrdersController_create_v1
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderDto"
      responses:
        "201":
          description: Pesanan berhasil dibuat dan stok menu berhasil dikurangi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Validasi gagal atau stok menu tidak mencukupi (transaksi di-rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Salah satu menu_id tidak ditemukan (transaksi di-rollback)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Membuat pesanan baru dengan Database Transaction (QueryRunner)
      tags:
        - Orders
    get:
      operationId: OrdersController_findAll_v1
      parameters: []
      responses:
        "200":
          description: Daftar pesanan berhasil diambil
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
      summary: Mengambil daftar seluruh pesanan kantin
      tags:
        - Orders
  /api/v1/orders/{id}:
    get:
      operationId: OrdersController_findOne_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
      responses:
        "200":
          description: Detail pesanan ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Pesanan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Mengambil detail pesanan beserta item berdasarkan ID
      tags:
        - Orders
  /api/v1/orders/{id}/status:
    patch:
      operationId: OrdersController_updateStatus_v1
      parameters:
        - name: id
          required: true
          in: path
          schema:
            example: 1
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrderStatusDto"
      responses:
        "200":
          description: Status pesanan berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Status pesanan tidak valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
        "404":
          description: Pesanan tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsDto"
      summary: Memperbarui status pesanan (pending | processing | completed | cancelled)
      tags:
        - Orders
info:
  title: Smart Canteen REST API
  description: Dokumentasi kontrak REST API Aplikasi Pemesanan Kantin Kampus
    (Smart Canteen) — mencakup manajemen Stan (Stalls), Menu (Filtering, Offset
    Pagination, Tie-breaker Sorting, ETag & Optimistic Locking), serta Pesanan
    Transaksional (Orders) dengan standar error RFC 7807 / RFC 9457 Problem
    Details.
  version: 1.0.0
  contact: {}
tags:
  - name: Stalls
    description: Manajemen data stan kantin kampus
  - name: Menus
    description: Manajemen katalog menu, stok, dan ETag optimistic locking
  - name: Orders
    description: Pemesanan menu kantin dengan transaksi database atomik
servers: []
components:
  schemas:
    Stall:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: ID unik stan kantin
        name:
          type: string
          example: Kantin Bu Sari
          description: Nama stan kantin (unik)
        location:
          type: string
          example: Gedung A Lantai 1 - Stan No. 3
          description: Lokasi stan di area kampus
        is_open:
          type: boolean
          example: true
          description: Status operasional buka/tutup stan kantin
          default: true
        created_at:
          format: date-time
          type: string
          example: 2026-11-08T10:00:00.000Z
          description: Waktu pembuatan data stan
        updated_at:
          format: date-time
          type: string
          example: 2026-11-08T10:00:00.000Z
          description: Waktu pembaruan terakhir data stan
      required:
        - id
        - name
        - location
        - is_open
        - created_at
        - updated_at
    ProblemDetailsDto:
      type: object
      properties:
        type:
          type: string
          example: https://smartcanteen.ac.id/errors/bad-request
          description: URI referensi yang mengidentifikasi jenis masalah (RFC 7807 / RFC
            9457)
        title:
          type: string
          example: Bad Request
          description: Ringkasan singkat masalah yang dapat dibaca manusia
        status:
          type: number
          example: 400
          description: Kode status HTTP yang dihasilkan oleh server
        detail:
          type: string
          example: price must not be less than 1000
          description: Penjelasan spesifik mengenai kemunculan masalah ini
        instance:
          type: string
          example: /api/v1/menus
          description: URI yang mengidentifikasi kemunculan spesifik dari masalah ini
      required:
        - type
        - title
        - status
        - detail
        - instance
    CreateStallDto:
      type: object
      properties:
        name:
          type: string
          example: Kantin Bu Sari
          description: Nama stan kantin (wajib unik)
        location:
          type: string
          example: Gedung A Lantai 1 - Stan No. 3
          description: Lokasi stan di dalam area kampus
        is_open:
          type: boolean
          example: true
          default: true
          description: Status operasional stan (buka/tutup)
      required:
        - name
        - location
    UpdateStallDto:
      type: object
      properties:
        name:
          type: string
          example: Kantin Bu Sari Nusantara
          description: Nama stan kantin (wajib unik)
        location:
          type: string
          example: Gedung B Lantai Dasar - Stan No. 1
          description: Lokasi stan di dalam area kampus
        is_open:
          type: boolean
          example: false
          description: Status operasional stan (buka/tutup)
    Menu:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: ID unik menu kantin
        stall_id:
          type: number
          example: 1
          description: ID stan pemilik menu (FK ke stalls.id)
        name:
          type: string
          example: Nasi Goreng Spesial Kampus
          description: Nama menu (wajib unik)
        category:
          type: string
          example: makanan
          enum:
            - makanan
            - minuman
            - snack
          description: Kategori menu kantin
        price:
          type: number
          example: 15000
          minimum: 1000
          description: Harga menu dalam Rupiah (minimal 1000)
        stock:
          type: number
          example: 25
          minimum: 0
          description: Jumlah stok porsi yang tersedia (minimal 0)
        is_available:
          type: boolean
          example: true
          default: true
          description: Status ketersediaan menu
        version:
          type: number
          example: 1
          description: Versi record untuk ETag dan Optimistic Locking
        created_at:
          format: date-time
          type: string
          example: 2026-11-08T10:00:00.000Z
          description: Waktu pembuatan menu
        updated_at:
          format: date-time
          type: string
          example: 2026-11-08T10:00:00.000Z
          description: Waktu pembaruan terakhir menu
      required:
        - id
        - stall_id
        - name
        - category
        - price
        - stock
        - is_available
        - version
        - created_at
        - updated_at
    PaginationMetaDto:
      type: object
      properties:
        total_items:
          type: number
          example: 25
          description: Total seluruh item yang cocok dengan filter
        item_count:
          type: number
          example: 10
          description: Jumlah item pada halaman saat ini
        items_per_page:
          type: number
          example: 10
          description: Batas jumlah item per halaman (limit)
        total_pages:
          type: number
          example: 3
          description: Total halaman yang tersedia
        current_page:
          type: number
          example: 1
          description: Halaman saat ini (page)
      required:
        - total_items
        - item_count
        - items_per_page
        - total_pages
        - current_page
    PaginatedMenuResponseDto:
      type: object
      properties:
        data:
          description: Daftar data menu pada halaman ini
          type: array
          items:
            $ref: "#/components/schemas/Menu"
        meta:
          description: Metadata offset pagination
          allOf:
            - $ref: "#/components/schemas/PaginationMetaDto"
      required:
        - data
        - meta
    CreateMenuDto:
      type: object
      properties:
        stall_id:
          type: number
          example: 1
          description: ID stan kantin tempat menu dijual
        name:
          type: string
          example: Nasi Goreng Spesial Kampus
          description: Nama menu (wajib unik)
        category:
          type: string
          example: makanan
          enum:
            - makanan
            - minuman
            - snack
          description: Kategori menu (makanan | minuman | snack)
        price:
          type: number
          example: 15000
          minimum: 1000
          description: Harga satuan menu dalam Rupiah (minimal Rp 1.000)
        stock:
          type: number
          example: 25
          minimum: 0
          description: Stok menu tersedia (minimal 0)
        is_available:
          type: boolean
          example: true
          default: true
          description: Status ketersediaan menu
      required:
        - stall_id
        - name
        - category
        - price
        - stock
    UpdateMenuDto:
      type: object
      properties:
        stall_id:
          type: number
          example: 1
          description: ID stan kantin tempat menu dijual
        name:
          type: string
          example: Nasi Goreng Spesial Kampus Jumbo
          description: Nama menu (wajib unik)
        category:
          type: string
          example: makanan
          enum:
            - makanan
            - minuman
            - snack
          description: Kategori menu (makanan | minuman | snack)
        price:
          type: number
          example: 18000
          minimum: 1000
          description: Harga satuan menu dalam Rupiah (minimal Rp 1.000)
        stock:
          type: number
          example: 30
          minimum: 0
          description: Stok menu tersedia (minimal 0)
        is_available:
          type: boolean
          example: true
          description: Status ketersediaan menu
    CreateOrderItemDto:
      type: object
      properties:
        menu_id:
          type: number
          example: 1
          description: ID menu yang dipesan
        quantity:
          type: number
          example: 2
          minimum: 1
          description: Jumlah porsi yang dipesan (minimal 1)
        notes:
          type: string
          example: Pedas sedang
          description: Catatan khusus untuk item menu
      required:
        - menu_id
        - quantity
    CreateOrderDto:
      type: object
      properties:
        customer_name:
          type: string
          example: Budi Santoso
          description: Nama lengkap pemesan
        table_number:
          type: string
          example: A-12
          description: Nomor meja kantin tempat pemesan duduk
        items:
          description: Daftar item menu yang dipesan (minimal 1 item)
          type: array
          items:
            $ref: "#/components/schemas/CreateOrderItemDto"
      required:
        - customer_name
        - table_number
        - items
    OrderItem:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: ID unik item pesanan
        order_id:
          type: number
          example: 1
          description: ID pesanan induk (FK ke orders.id)
        menu_id:
          type: number
          example: 1
          description: ID menu yang dipesan (FK ke menus.id)
        quantity:
          type: number
          example: 2
          description: Jumlah porsi yang dipesan
        price:
          type: number
          example: 15000
          description: Harga satuan menu pada saat transaksi berlangsung
        subtotal:
          type: number
          example: 30000
          description: Subtotal harga item (quantity * price)
        notes:
          type: object
          example: Pedas sedang, tanpa bawang goreng
          nullable: true
          description: Catatan tambahan untuk item pesanan
      required:
        - id
        - order_id
        - menu_id
        - quantity
        - price
        - subtotal
    Order:
      type: object
      properties:
        id:
          type: number
          example: 1
          description: ID unik pesanan
        customer_name:
          type: string
          example: Budi Santoso
          description: Nama pemesan (mahasiswa/dosen/staf)
        table_number:
          type: string
          example: A-12
          description: Nomor meja kantin
        order_status:
          type: string
